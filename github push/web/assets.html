<html><body style="margin:0;background:transparent"><canvas id="c" width="800" height="800"></canvas>
<script type="module">
import { Pen, mascot, emu } from "./cast.js";
const cv=document.getElementById('c'), g=cv.getContext('2d');
const mode=new URLSearchParams(location.search).get('m')||'profile';
g.lineJoin="round"; g.lineCap="round";
if(mode==='profile'){
  g.fillStyle="#ffd34a"; g.beginPath(); g.arc(400,400,400,0,7); g.fill();
  for(let i=0;i<16;i++){ g.fillStyle=i%2?"#ffd34a":"#ffe07a"; g.beginPath(); g.moveTo(400,400); g.arc(400,400,400,i*Math.PI/8,(i+1)*Math.PI/8); g.fill(); }
  // emu peeking from right
  g.save(); g.translate(1130,250); g.scale(-0.78,0.78); emu(new Pen(g),{mode:"stand",expr:"smug",chest:1,seed:3}); g.restore();
  g.save(); g.translate(-60,-40); g.scale(1.3,1.3); mascot(new Pen(g),{expr:"grin"}); g.restore();
  // clip to circle
  g.globalCompositeOperation="destination-in"; g.beginPath(); g.arc(400,400,398,0,7); g.fill();
}
if(mode==='mascot'){ g.save(); g.scale(0.8,0.8); mascot(new Pen(g),{expr:"grin",wave:0.9}); g.restore(); }
window.done=true;
</script></body></html>
